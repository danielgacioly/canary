<title>Canary Crew Health</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one answer per screen. A status orb and a single sentence first, three pillars second, everything else one tap away. */
:root{
  --paper:#f5f7fb; --surface:#ffffff; --sunk:#eaeef5; --line:#dde3ee; --ink:#08142b; --muted:#5a6780;
  --blue:#0b3d91; --red:#e0321a;
  --ok:#14804a; --warn:#b06f00; --act:#d03a12; --ok-bg:#e2f4ea; --warn-bg:#fcf1d8; --act-bg:#fde5dc;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#050b18; --surface:#0c172c; --sunk:#14223d; --line:#1d2d4d; --ink:#edf2fc; --muted:#8e9fbe;
  --blue:#7eabff; --red:#ff5237;
  --ok:#4fd08e; --warn:#f2b83d; --act:#ff7b4f; --ok-bg:#0d2a20; --warn-bg:#30260c; --act-bg:#391a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#050b18; --surface:#0c172c; --sunk:#14223d; --line:#1d2d4d; --ink:#edf2fc; --muted:#8e9fbe;
  --blue:#7eabff; --red:#ff5237;
  --ok:#4fd08e; --warn:#f2b83d; --act:#ff7b4f; --ok-bg:#0d2a20; --warn-bg:#30260c; --act-bg:#391a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:110%;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.015em}
h2{font-size:21px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
.lbl{font:500 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s0{--c:var(--ok);--cb:var(--ok-bg)} .s1{--c:var(--warn);--cb:var(--warn-bg)} .s2{--c:var(--act);--cb:var(--act-bg)}
.c{color:var(--c)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.brand b{font:800 20px/1 var(--f-display);font-stretch:125%;letter-spacing:.16em}
.bird{width:26px;height:26px;color:var(--warn);flex:none}
.where{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:14px}
.where::after{content:"";border:5px solid transparent;border-top-color:var(--muted);margin-top:5px}
.crew{display:flex;gap:6px}
.av{width:36px;height:36px;border-radius:50%;background:var(--sunk);font:500 12px/1 var(--f-mono);display:grid;place-items:center;position:relative}
.av.on{background:var(--ink);color:var(--paper)}
.av i{position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--paper)}
.sos{position:relative;overflow:hidden;background:#e0321a;color:#fff;font:800 14px/1 var(--f-display);font-stretch:118%;letter-spacing:.12em;padding:13px 20px;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none}
.sos::before{content:"";position:absolute;inset:0;background:#fff;opacity:.35;transform:scaleX(0);transform-origin:left;transition:transform .15s}
.sos.hold::before{transform:scaleX(1);transition:transform 1s linear}
.sos span{position:relative}
.tabs{display:flex;gap:4px;padding-block:14px 0}
.tab{padding:9px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--paper)}
.tab .cnt{font:500 11px var(--f-mono);background:var(--act);color:#fff;padding:1px 7px;border-radius:9px;margin-left:6px}
main{padding-block:18px 10px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
@media (max-width:820px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .sp{margin-left:auto}
.btn{padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;background:var(--sunk)}
.btn:hover{filter:brightness(.96)}
.btn.pri{background:var(--ink);color:var(--paper)} .btn.sm{padding:6px 13px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--cb);color:var(--c)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag{font:500 10px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tag.real{border-color:var(--blue);color:var(--blue)}

/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 28px;border-left:8px solid var(--c)}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr);justify-items:start;padding:20px}}
.orb{position:relative;width:240px;height:240px;max-width:100%;display:grid;place-items:center;flex:none}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb .o1{fill:var(--cb);stroke:var(--c);stroke-width:3}
.orb .o2{fill:none;stroke:var(--c);stroke-width:1.5;stroke-dasharray:2 9;opacity:.7;transform-origin:center;animation:spin 40s linear infinite}
.orb .o3{fill:none;stroke:var(--c);stroke-width:6;opacity:.25;transform-origin:center;animation:pulse 2.6s ease-out infinite}
.s0 .orb .o3{animation:none;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes pulse{0%{transform:scale(.86);opacity:.5}100%{transform:scale(1.08);opacity:0}}
.orb .ini{font:800 54px var(--f-display);color:var(--c)}
#mvslot{position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden}
model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
.hero .word{font:800 13px var(--f-display);font-stretch:120%;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.hero ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:n}
.hero li{display:flex;gap:12px;align-items:baseline;font-size:17px;font-weight:500}
.hero li::before{counter-increment:n;content:counter(n);flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--surface);font:500 12px/24px var(--f-mono);text-align:center}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.strip>div{background:var(--surface);padding:14px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.strip b{font:700 19px/1.2 var(--f-display);font-stretch:108%}
.pil{text-align:left;border-top:6px solid var(--c);gap:14px}
.pil:hover{border-color:var(--c);filter:brightness(.985)}
.pil .st{font:800 26px/1 var(--f-display);font-stretch:108%;color:var(--c)}
.met{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding-top:10px;border-top:1px solid var(--line)}
.met b{font-weight:600} .met .v{font:500 17px var(--f-mono)} .met .d{grid-column:1/-1;font-size:13px;color:var(--muted)}
.met .d i{font-style:normal;color:var(--c);font-weight:600}
.alert{border-left:8px solid var(--c)}
.alert ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.spark{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}

.goal{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0;padding-bottom:0}
.chk{flex:none;width:28px;height:28px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.goal.done .chk{background:var(--ok);border-color:var(--ok)} .goal.done .chk svg{stroke-dashoffset:0}
.goal.done .gt{text-decoration:line-through;color:var(--muted)}
.gt{font-weight:600}
.ring{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ring b{font:800 30px/1 var(--f-display)}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .5s}

.story{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.story .wrap{padding-block:10px;display:flex;gap:14px;align-items:center}
.story .txt{flex:1;min-width:0;font-size:14px;line-height:1.35}
.story .lbl{color:inherit;opacity:.6}
.story button.nv{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);font-size:18px}
.story.min .txt,.story.min .nv{display:none}
.story .hide{font-size:13px;opacity:.7;text-decoration:underline;flex:none}

.sosv{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;display:flex;flex-direction:column}
.sosv .bar2{background:#c9281a;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.sosv .bar2 .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:12px}
.sosv .bar2 b{font:800 17px var(--f-display);font-stretch:120%;letter-spacing:.1em}
.sosv .clock{font:500 24px var(--f-mono);margin-left:auto}
.sosv .bar2 .btn{background:#ffffff26;color:#fff}
.sosbody{flex:1;padding-block:20px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,7fr) minmax(0,4fr);align-content:start}
@media (max-width:820px){.sosbody{grid-template-columns:minmax(0,1fr)}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pick button{border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:96px}
.pick button:hover{border-color:var(--red)}
.pick b{font:700 19px/1.15 var(--f-display);font-stretch:108%}
.step{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--red);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px}
.step .big{font:700 clamp(23px,3.4vw,34px)/1.2 var(--f-display);font-stretch:106%;text-wrap:balance}
.step .q{font:800 clamp(23px,3.2vw,32px)/1.2 var(--f-display);color:var(--red)}
.here{background:var(--sunk);padding:14px 16px;border-radius:12px}
.yn{display:flex;gap:12px;flex-wrap:wrap}
.yn button{flex:1 1 140px;padding:20px;border-radius:14px;font:800 21px var(--f-display);letter-spacing:.06em;border:2px solid var(--ink)}
.yn button.go{background:var(--ink);color:var(--paper)}
.metro{width:74px;height:74px;border-radius:50%;background:var(--red);animation:beat .545s ease-out infinite;flex:none}
@keyframes beat{0%{transform:scale(1)}18%{transform:scale(.72)}100%{transform:scale(1)}}
.breath{width:120px;height:120px;border-radius:50%;border:4px solid var(--blue);background:color-mix(in srgb,var(--blue) 18%,transparent);animation:breath 10s ease-in-out infinite;flex:none}
@keyframes breath{0%{transform:scale(.55)}40%{transform:scale(1)}100%{transform:scale(.55)}}
.log{font:13px/1.5 var(--f-mono);display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.log span{color:var(--muted)}

.modal{position:fixed;inset:0;z-index:70;background:#050b18cc;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--surface);border-radius:20px;padding:24px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.modal>div.wide{width:min(860px,100%)}
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.loc{border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.loc.on{border-color:var(--ink)}
.loc b{font:700 18px var(--f-display);font-stretch:108%}
.loc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:13px}
.loc dt{color:var(--muted)} .loc dd{margin:0;font-weight:600}
.pvt{height:210px;border-radius:14px;background:var(--ink);display:grid;place-items:center;color:var(--paper);font:700 20px var(--f-display);cursor:pointer;user-select:none;text-align:center;padding:10px}
.pvt.go{background:#e0321a;color:#fff}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods button{background:var(--sunk);border-radius:12px;padding:14px 4px;font-size:14px;font-weight:600}
input[type=text],input[type=password],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:90vw}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
[contenteditable]{outline:1px dashed var(--line);padding:1px 4px;border-radius:4px}
[contenteditable]:focus{outline:2px solid var(--blue)}
footer{padding-block:6px 0;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
footer button{text-decoration:underline;text-underline-offset:3px}
@media (max-width:600px){.where span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab{padding:8px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer-umd.min.js" async></script>
<script>

 earth:{n:'Earth',sub:'Pre-flight training',gk:'g1',g:'1 g',delay:0,reply:'Live',hosp:'Minutes',rad:'0.01 mSv/day',mSv:.01,what:'Canary only learns what your normal looks like. No alerts yet.'},

 mars:{n:'Mars',sub:'Gale crater',gk:'gp',g:'3/8 g',delay:840,reply:'28 minutes',hosp:'About 500 days',rad:'0.7 mSv/day',mSv:.67,what:'Your body is relearning weight after months in 0 g. Stand up slowly.'}
};

};

 {id:'k',n:'Kenji Mori',role:'Crew medical officer',ini:'KM',cbc:'C002',base:{sleep:7.0,react:280,mood:3.9,stress:2.2,hr:62,bp:121,temp:36.6,spo2:97.5,gluc:92,exer:90,water:2.4}},
 {id:'a',n:'Amara Okafor',role:'Flight engineer',ini:'AO',cbc:'C003',base:{sleep:7.8,react:250,mood:4.3,stress:1.8,hr:55,bp:110,temp:36.4,spo2:98.5,gluc:85,exer:110,water:2.8}},
 {id:'t',n:'Tomás Rivera',role:'Geologist',ini:'TR',cbc:'C004',base:{sleep:6.9,react:290,mood:3.8,stress:2.4,hr:66,bp:124,temp:36.7,spo2:97.8,gluc:95,exer:85,water:2.3}}
];
const CH=[
 {loc:'earth',day:-30,me:'h',storm:null,when:'30 days before launch',x:'The crew measures everything it will measure in space. From here on, Canary compares each person with themselves, never with an average.'},

 {loc:'transit',day:147,me:'h',storm:null,when:'Day 147, on the way to Mars',x:'Helena’s sleep, mood and reaction time have been slipping together for two weeks. None would matter alone. Together they do.'},
 {loc:'transit',day:152,me:'h',storm:'sep',when:'Day 152, replaying 10 May 2024',x:'This storm really happened: the strongest in 20 years. The readings on screen are NASA’s records from that day. What if a crew had been in its path?'},
 {loc:'transit',day:153,me:'k',storm:null,when:'Day 153, dinner',x:'Tomás has a seizure. Earth will not know for 5 minutes. Hold EMERGENCY, pick Seizure and follow the steps.'},
 {loc:'mars',day:222,me:'a',storm:'mars',when:'Sol 12 on Mars, replaying 20 May 2024',x:'That day the Curiosity rover measured radiation 51 times above normal. The chart is that record. The crew stays inside.'}
];
/* Guided Response protocol bank. v = adaptation by gravity (g0, gp, g1) or by place */
const SOS={

    <div class="row"><button class="btn pri" data-a="sosclose">Send report and close</button></div></div>`}
  else{const p=SOS[s.p],st=p.steps[s.i],vt=sosText(st);
    main=`<div class="step fade"><div class="row"><span class="lbl">${p.n} · step ${s.i+1}</span>${st.timer?`<span class="num sp" id="sosStep" style="font-size:22px"></span>`:''}</div>
     <div class="row" style="flex-wrap:nowrap;gap:20px;align-items:center">${st.metro?'<div class="metro" aria-hidden="true"></div>':''}${st.breath?'<div class="breath" aria-hidden="true"></div>':''}<div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:12px">${st.t?`<div class="big">${st.t}</div>`:''}${st.q?`<div class="q">${st.q}</div>`:''}</div></div>
     ${vt?`<div class="here"><span class="lbl">Here in ${l.n} · ${l.g}</span><p style="font-size:17px">${vt}</p></div>`:''}
     ${st.q?`<div class="yn"><button class="go" data-a="sosans" data-k="yes">YES</button><button data-a="sosans" data-k="no">NO</button></div>`:`<div class="yn"><button class="go" data-a="sosnext">${st.end?'FINISH':'DONE, NEXT'}</button></div>`}
     <div class="row"><button class="btn sm" data-a="sosback">Change situation</button><button class="btn sm" data-a="voice">${S.voice?'Stop reading aloud':'Read aloud'}</button></div></div>`}
  const p=s.p&&SOS[s.p];
  return `<div class="sosv" role="dialog" aria-label="Guided Response"><div class="bar2"><div class="wrap"><b>GUIDED RESPONSE</b><span class="small">${l.n} · ${dayLbl()}</span><span class="clock num" id="sosClock">${mmss(el)}</span><button class="btn sm" data-a="sosclose">End</button></div></div>
   <div class="wrap sosbody">${main}<div class="grid" style="align-content:start">
    <div class="card"><span class="lbl">Earth</span><p>${l.delay<2?'Mission control has been told and is following live.':'<span id="sosEarth"></span>'}</p></div>

}
function sosLog(t){const s=S.sos;s.log.unshift([mmss((Date.now()-s.t0)/1000),t])}
function sosGo(to){const s=S.sos;if(typeof to==='string'){s.p=to;s.i=to==='cpr'?1:0;sosLog('Switched to: '+SOS[to].n)}else if(to==null)s.i++;else s.i=to;s.st0=Date.now();speak()}

function viewModal(){

  if(m.k==='about'){wide='wide';b=`<span class="lbl">NASA Space Apps Challenge 2026 · prototype</span><h2>A watch-keeper for when Earth is too far to answer.</h2>
   <p>On the way to Mars a question to the doctor takes up to 24 minutes to arrive, and as long to come back. Canary stays on board for that gap. It tracks each astronaut against their own normal, turns alerts into goals, and guides first response step by step, adapted to where the crew is.</p>
   <h3>Why “Canary”</h3><p>For more than a century, miners carried canaries underground. The bird is small and feels bad air before people do. When it went quiet, the miners knew to leave, long before they felt anything themselves. A spacecraft is a sealed mine: no windows to open, no hospital next door. Canary is the bird that never stops watching, so the crew hears the warning while there is still time to act.</p>
   <h3>NASA data in this prototype</h3><div class="scroll"><table><tr><th>Source</th><th>Used for</th></tr><tr><td><b>DONKI</b> space weather, 5 to 16 May 2024</td><td>Storm alert in story step 4</td></tr><tr><td><b>Curiosity RAD</b> level 2, 9 and 20 May 2024</td><td>Mars radiation chart in step 6</td></tr><tr><td><b>OSD-569</b> Inspiration4 blood counts</td><td>Lymphocyte chart in Health</td></tr><tr><td><b>NASA 3D Resources</b> astronaut model</td><td>Status orb on Today</td></tr></table></div>

   <h3>Who would use it</h3><p>Space agencies and commercial crew operators license it per mission. Analog habitats and polar stations use a training version. The same system serves isolated places on Earth, such as offshore platforms, ships and remote river communities, where the hospital is also far away. The core stays open source.</p>`}
  if(m.k==='pin')b=`<h2>Medical team</h2><p class="muted">Flight surgeons only. In this prototype the PIN is 1961.</p><form data-f="pin" class="row"><input type="password" id="pin" inputmode="numeric" maxlength="4" autocomplete="off" style="width:130px;font:500 22px var(--f-mono);letter-spacing:.3em" aria-label="PIN"><button class="btn pri">Enter</button></form>${m.err?'<p class="s2 c">Wrong PIN.</p>':''}`;

   :(()=>{const avg=Math.round(m.rts.reduce((a,b)=>a+b)/5),d=avg-c.base.react,l=d>45?2:d>27?1:0;return `<div class="card alert s${l}"><span class="pill">${ST[l]}</span><b class="num" style="font-size:34px">${avg} ms</b><p>${l?`${d} ms slower than your normal of ${c.base.react} ms. Avoid critical tasks and retake it after rest.`:`Within your normal of ${c.base.react} ms.`}</p></div><p class="small muted">On a regular screen the number includes device lag. On the ship, each person’s baseline is measured on the same terminal.</p>`})()}`}
  if(m.k==='mood')b=`<h2>How are you right now?</h2><div class="moods">${['Very low','Low','So-so','Good','Great'].map((t,i)=>`<button data-a="moodset" data-k="${i+1}">${t}</button>`).join('')}</div><p class="small muted">Only you and the medical team see your answer.</p>`;
  if(m.k==='amsler')b=`<h2>Eye grid</h2><p class="muted">Cover one eye and stare at the red dot from about 30 cm. Repeat with the other eye.</p><svg viewBox="0 0 200 200" style="width:min(300px,100%);align-self:center">${Array.from({length:21},(_,i)=>`<line x1="${i*10}" y1="0" x2="${i*10}" y2="200" stroke="var(--ink)" stroke-width=".6"/><line x1="0" y1="${i*10}" x2="200" y2="${i*10}" stroke="var(--ink)" stroke-width=".6"/>`).join('')}<circle cx="100" cy="100" r="3.5" fill="var(--red)"/></svg><p><b>Does any line look wavy, faded or blurred?</b></p><div class="row"><button class="btn" data-a="amsler" data-k="no">No, all straight</button><button class="btn" data-a="amsler" data-k="yes">Yes</button></div>`;
  return `<div class="modal" data-a="modalbg"><div role="dialog" aria-modal="true" class="${wide}">${b}<button class="btn sm" data-a="modalclose" style="align-self:flex-end">Close</button></div></div>`;
}

/* ===================== FRAME ===================== */
function render(){
  const c=crew(),ch=CH[S.ch],nA=alerts(c).length;
  const tabs=[['today','Today'],['goals','Goals'],['health','Health']],views={today:viewToday,goals:viewGoals,health:viewHealth};
  $('#app').innerHTML=`
  <div class="top"><div class="wrap"><div class="brand"><svg class="bird" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 9l5 3-1 4c0 6 5 11 12 11 5 0 8-3 8-7 0-3-2-5-4-6-1-1-1-3-3-4-3-2-6-1-8 1L3 9z" fill="currentColor"/><circle cx="12" cy="13" r="1.4" fill="var(--paper)"/></svg><b>CANARY</b></div>
    <button class="where" data-a="modal" data-k="where" aria-label="Change location"><span>${L().n}</span></button>
    ${S.mode==='crew'?`<div class="crew" role="group" aria-label="Who is using the terminal">${CREW.map(x=>{const l=Math.max(0,...alerts(x).filter(a=>!a.env).map(a=>a.l));return `<button class="av s${l} ${x.id===S.me?'on':''}" data-a="me" data-k="${x.id}" title="${x.n}" aria-label="${x.n}">${x.ini}${l?'<i></i>':''}</button>`}).join('')}</div>`:''}
    <button class="sos" id="sosBtn" aria-label="Emergency: hold to open Guided Response"><span>HOLD FOR EMERGENCY</span></button></div></div>
  <main class="wrap">${S.mode==='med'?viewMed():`<nav class="tabs" style="padding-block:0">${tabs.map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" data-a="tab" data-k="${k}">${n}${k==='health'&&nA?`<span class="cnt">${nA}</span>`:''}</button>`).join('')}</nav>${views[S.tab]()}`}
   <footer><span>Student prototype for the NASA Space Apps Challenge 2026. Not a NASA product and not medical advice.</span><button data-a="modal" data-k="about">About and data sources</button>${S.mode==='crew'?'<button data-a="medin">Medical team sign-in</button>':''}</footer></main>
  <div class="story ${S.storyMin?'min':''}"><div class="wrap"><button class="nv" data-a="ch" data-k="${(S.ch+CH.length-1)%CH.length}" aria-label="Previous story step">‹</button>
   <div class="txt"><span class="lbl">Demo story ${S.ch+1}/${CH.length} · ${ch.when}</span><br>${ch.x}</div>
   <button class="nv" data-a="ch" data-k="${(S.ch+1)%CH.length}" aria-label="Next story step">›</button><button class="hide" data-a="storymin">${S.storyMin?'Show demo story':'Hide'}</button></div></div>
  ${S.sos?viewSOS():''}${S.modal?viewModal():''}`;
  bindSOS();mountModel();tick();
}
function mountModel(){
  const slot=$('#mvslot');if(!slot||modelIdx>=MODELS.length||!window.customElements||!customElements.get('model-viewer'))return;
  if(!MV){MV=document.createElement('model-viewer');MV.setAttribute('alt','Astronaut, NASA 3D model');MV.setAttribute('auto-rotate','');MV.setAttribute('rotation-per-second','18deg');MV.setAttribute('interaction-prompt','none');MV.setAttribute('disable-zoom','');MV.setAttribute('camera-orbit','0deg 80deg 105%');MV.setAttribute('exposure','1.1');MV.src=MODELS[modelIdx];
    MV.addEventListener('error',()=>{modelIdx++;if(modelIdx<MODELS.length)MV.src=MODELS[modelIdx];else{MV.remove();render()}})}
  slot.innerHTML='';slot.appendChild(MV);
}
if(window.customElements)customElements.whenDefined('model-viewer').then(()=>mountModel());
function toast(t){const d=document.createElement('div');d.className='toast fade';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function setCh(i){const x=CH[i];Object.assign(S,{ch:i,loc:x.loc,day:x.day,me:x.me,storm:x.storm,tab:'today',mode:'crew',over:{},modal:null});render();window.scrollTo(0,0)}
function send(from,text){S.queue.push({id:'m'+Date.now(),from,text,sent:Date.now(),delay:L().delay})}
function openSOS(k){S.sos={t0:Date.now(),st0:Date.now(),p:null,i:0,log:[],who:null,done:false,delay:L().delay};sosLog('Opened in '+L().n);if(k){S.sos.p=k;sosLog('Situation: '+SOS[k].n)}render()}
function bindSOS(){const b=$('#sosBtn');if(!b)return;let t;const stop=()=>{clearTimeout(t);b.classList.remove('hold')};
  b.onpointerdown=e=>{e.preventDefault();b.classList.add('hold');t=setTimeout(()=>{stop();openSOS()},1000)};b.onpointerup=b.onpointerleave=b.onpointercancel=stop;
  b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSOS()}};b.oncontextmenu=e=>e.preventDefault()}
function tick(){
  const s=S.sos;if(s){const el=(Date.now()-s.t0)/1000,c=$('#sosClock');if(c&&!s.done)c.textContent=mmss(el);
    const e=$('#sosEarth');if(e){const left=s.delay-el*QSPEED;e.innerHTML=(left>0?`Gets this alert in <b class="num">${mmss(left)}</b>. Earliest reply in <b class="num">${mmss(left+s.delay)}</b>.`:left+s.delay>0?`Alert received. Reply arriving in <b class="num">${mmss(left+s.delay)}</b>.`:'Reply received: "We are with you. Follow the steps and send vital signs."')+`<br><span class="small muted">Clock runs ${QSPEED}× faster in this demo.</span>`}
    const st=$('#sosStep');if(st&&s.p&&!s.done){const T=SOS[s.p].steps[s.i].timer;if(T){const left=T-(Date.now()-s.st0)/1000;st.textContent=left>0?mmss(left):'time!'}}}
  document.querySelectorAll('[data-q]').forEach(td=>{const m=S.queue.find(x=>x.id===td.dataset.q);if(!m)return;const left=m.delay-(Date.now()-m.sent)/1000*QSPEED;td.textContent=left>0?mmss(left):'delivered'});
}
setInterval(tick,500);

/* ===================== ACTIONS ===================== */
let pvtT;
const ACT={
 tab:k=>{S.tab=k;render();window.scrollTo(0,0)},me:k=>{S.me=k;render()},
 loc:k=>{S.loc=k;S.storm=null;S.modal=null;S.day={earth:-30,rocket:2,iss:60,moon:20,transit:147,mars:222}[k];render();toast('Now in '+LOCS[k].n+'. Goals, alerts and emergency steps adjusted.')},
 ch:k=>setCh(+k),storymin:()=>{S.storyMin=!S.storyMin;render()},
 goal:k=>{const c=crew(),g=goalsFor(c).find(x=>x.id===k);S.done[gkey(c,g)]=!isDone(c,g);render()},
 modal:k=>{S.modal=k==='pvt'?{k,st:'idle',rts:[]}:{k};render()},modalclose:()=>{clearTimeout(pvtT);S.modal=null;render()},
 modalbg:(k,e)=>{if(e.target.classList.contains('modal'))ACT.modalclose()},
 medin:()=>{S.modal={k:'pin'};render();setTimeout(()=>{const p=$('#pin');p&&p.focus()},50)},medout:()=>{S.mode='crew';render()},medtab:k=>{S.medTab=k;render()},
 sosopen:k=>openSOS(k),soswho:k=>{S.sos.who=k;sosLog('Patient: '+crew(k).n);render()},
 sospick:k=>{S.sos.p=k;S.sos.i=0;S.sos.st0=Date.now();sosLog('Situation: '+SOS[k].n);render();speak()},
 sosback:()=>{S.sos.p=null;S.sos.done=false;render()},
 sosnext:()=>{const s=S.sos,st=SOS[s.p].steps[s.i];sosLog('Done: step '+(s.i+1));if(st.end){s.done=true;sosLog('Protocol finished')}else sosGo(null);render()},
 sosans:k=>{const s=S.sos,st=SOS[s.p].steps[s.i];sosLog((st.q||'Question')+' '+(k==='yes'?'Yes':'No'));const to=st[k];if(to==null&&st.end)s.done=true;else sosGo(to==null?null:to);render()},
 sosclose:()=>{const s=S.sos;try{speechSynthesis.cancel()}catch(e){}if(s.p){send('Ship · Guided Response',`${SOS[s.p].n}${s.who?' · '+crew(s.who).n:''} · ${mmss((Date.now()-s.t0)/1000)} · ${s.log.length} log entries`);toast('Report is on its way to Earth.')}S.sos=null;render()},
 voice:()=>{S.voice=!S.voice;render();speak()},
 pvttap:()=>{const m=S.modal;if(m.st==='idle'||m.st==='early'||m.st==='done'){m.st='wait';render();pvtT=setTimeout(()=>{m.st='go';m.t=performance.now();render()},1200+Math.random()*2600)}
   else if(m.st==='wait'){clearTimeout(pvtT);m.st='early';render()}
   else if(m.st==='go'){m.rts.push(Math.round(performance.now()-m.t));m.st='done';if(m.rts.length===5){const c=crew();S.over[c.id+'react']=Math.round(m.rts.reduce((a,b)=>a+b)/5);S.done[S.day+':'+c.id+':pvt']=true}render()}},
 moodset:k=>{const c=crew();S.over[c.id+'mood']=+k;S.done[S.day+':'+c.id+':mood']=true;S.modal=null;render();toast('Saved. Thank you for sharing.')},
 amsler:k=>{const c=crew();S.amsler[c.id]=k;S.modal=null;S.tab='health';render();toast(k==='yes'?'Saved as an alert. See Health.':'Saved: no change.')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=ACT[t.dataset.a];if(f)f(t.dataset.k,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('div[data-a]')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&S.modal)ACT.modalclose()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;
  if(f==='pin'){if($('#pin').value==='1961'){S.modal=null;S.mode='med';S.medTab='crew'}else S.modal.err=1;render();if(S.modal)$('#pin').focus()}
  if(f==='goal'){S.medGoals.push({id:'med'+Date.now(),t:$('#ng_t').value,p:$('#ng_p').value,who:$('#ng_w').value,note:$('#ng_y').value});render();toast('Goal sent. It now shows in the astronaut’s Goals.')}
  if(f==='crew'){const n=$('#nc_n').value.trim(),id='x'+CREW.length;CREW.push({id,n,role:$('#nc_r').value,ini:n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(),cbc:null,base:{sleep:7.2,react:270,mood:4,stress:2.1,hr:60,bp:118,temp:36.5,spo2:98,gluc:90,exer:90,water:2.5}});render();toast(n+' added. Now on the ship terminal.')}});
document.addEventListener('input',e=>{const r=e.target.dataset.r;if(r){S.th[r]=+e.target.value;const id=e.target.id;render();const n=document.getElementById(id);n&&n.focus()}});
document.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.e;if(!k)return;const[p,i,f,g]=k.split(':'),st=SOS[p].steps[+i];if(f==='v')st.v[g]=e.target.textContent;else st[f]=e.target.textContent});
S.storyMin=window.innerWidth<600;
render();
</script>
